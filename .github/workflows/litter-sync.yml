name: Litter-Robot sync

# Whisker throws away anything older than 7 days unless you pay for Whisker+,
# so we grab the window once a day and keep our own copy.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: litter-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch the latest readings
        env:
          WHISKER_EMAIL: ${{ secrets.WHISKER_EMAIL }}
          WHISKER_PASSWORD: ${{ secrets.WHISKER_PASSWORD }}
          LITTER_WEIGHT_UNIT: ${{ vars.LITTER_WEIGHT_UNIT || 'lb' }}
        run: python scripts/litter_sync.py

      - name: Commit anything new
        run: |
          if [[ -n "$(git status --porcelain data/litter.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/litter.json
            git commit -m "Litter-Robot: new readings for Yoshi"
            git push
          else
            echo "Nothing new since the last run."
          fi
